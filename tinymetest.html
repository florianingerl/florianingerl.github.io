<!doctype html>
<html>
<head>
  <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js"
          referrerpolicy="origin"></script>

  <script>
    tinymce.init({
      selector: '#editor',
      height: 400,
      plugins: 'code link lists image table',
      toolbar: 'undo redo | blocks | bold italic | bullist numlist | link image | code'
    });
  </script>
</head>
<body>
  <textarea id="editor">
    <p>Edit this content.</p>
  </textarea>
</body>
</html>
