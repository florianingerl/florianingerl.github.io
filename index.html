	<meta content="Nachhilfe in Mathe, Physik, Informatik, Ingenieurwesen, Chemie und Sprachen für Uni und Schule"

	<meta content="Nachhilfe, Mathe, Physik, Informatik, LMU München, Französisch, Englisch, Spanisch, Italienisch"
		name="keywords">

	<!--
		Stellt den Pfad wieder her, den die 404.html von GitHub Pages als
		"?/whiteboard" angehaengt hat, damit Vue Router die richtige Seite
		(z.B. /whiteboard) beim direkten Aufruf oder Neuladen anzeigt.
	-->
	<script type="text/javascript">
		(function (l) {
			if (l.search[1] === '/') {
				var decoded = l.search.slice(1).split('&').map(function (s) {
					return s.replace(/~and~/g, '&');
				}).join('?');
				window.history.replaceState(null, null,
					l.pathname.slice(0, -1) + decoded + l.hash
				);
			}
		}(window.location));
	</script>
</head>

<body>
	<div id="app"></div>
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
