<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="requestFullscreen puts an element into fullscreen mode">
  <rect x="0" y="0" width="520" height="320" fill="#f8f9fa"/>
  <rect x="1" y="1" width="518" height="318" fill="none" stroke="#ced4da" stroke-width="2"/>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#212529">Enter fullscreen</text>

  <!-- small window with arrow -->
  <rect x="30" y="70" width="150" height="110" fill="#ffffff" stroke="#495057" stroke-width="2"/>
  <rect x="30" y="70" width="150" height="20" fill="#495057"/>
  <rect x="46" y="108" width="118" height="56" fill="#d0e2ff" stroke="#0d6efd"/>
  <text x="105" y="142" font-size="12" text-anchor="middle" fill="#0a58ca">#video</text>

  <path d="M196 125 H268" stroke="#0d6efd" stroke-width="3" marker-end="url(#ar1)"/>
  <text x="232" y="115" font-size="11" text-anchor="middle" fill="#0d6efd">click</text>

  <!-- fullscreen window -->
  <rect x="290" y="56" width="200" height="150" fill="#ffffff" stroke="#0d6efd" stroke-width="3"/>
  <rect x="290" y="56" width="200" height="22" fill="#0d6efd"/>
  <path d="M474 62 h10 v10 M474 72 l10 -10" stroke="#fff" stroke-width="2" fill="none"/>
  <rect x="304" y="92" width="172" height="100" fill="#d0e2ff" stroke="#0d6efd"/>
  <text x="390" y="146" font-size="13" text-anchor="middle" fill="#0a58ca">fills the screen</text>

  <text x="30" y="248" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#495057">el.requestFullscreen();</text>
  <text x="30" y="278" font-size="12" fill="#c92a2a">only from a user gesture (click / key press)</text>

  <defs>
    <marker id="ar1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#0d6efd"/>
    </marker>
  </defs>
</svg>
