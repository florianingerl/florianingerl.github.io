<svg xmlns="http://www.w3.org/2000/svg" width="800" height="296" viewBox="0 0 800 296" role="img" aria-label="In eine Datei schreiben (C++)">
  <rect width="800" height="296" fill="#eef1f5"/>
  <rect x="16" y="16" width="768" height="264" rx="18" fill="#ffffff" stroke="#ced4da" stroke-width="2"/>
  <path d="M16 34 a18 18 0 0 1 18 -18 h732 a18 18 0 0 1 18 18 v40 h-768 z" fill="#0b7285"/>
  <circle cx="54" cy="46" r="8" fill="#ffffff" opacity="0.85"/>
  <circle cx="80" cy="46" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="106" cy="46" r="8" fill="#ffffff" opacity="0.4"/>
  <text x="140" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#ffffff">In eine Datei schreiben (C++)</text>
    <text x="56" y="108" font-family="Consolas, 'Courier New', monospace" font-size="23" fill="#212529" xml:space="preserve">#include &lt;fstream&gt;</text>
    <text x="56" y="144" font-family="Consolas, 'Courier New', monospace" font-size="23" fill="#212529" xml:space="preserve">std::ofstream f(&quot;ausgabe.txt&quot;);</text>
    <text x="56" y="180" font-family="Consolas, 'Courier New', monospace" font-size="23" fill="#212529" xml:space="preserve">f &lt;&lt; &quot;Hallo Welt&quot;;</text>
    <text x="56" y="216" font-family="Consolas, 'Courier New', monospace" font-size="23" fill="#212529" xml:space="preserve">f.close();</text>
</svg>
