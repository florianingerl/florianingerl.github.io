<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="In flexbox items grow with flex-grow, in grid the tracks are sized by the template">
  <rect x="0" y="0" width="520" height="320" fill="#f8f9fa"/>
  <rect x="1" y="1" width="518" height="318" fill="none" stroke="#ced4da" stroke-width="2"/>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#212529">Who decides the size?</text>

  <!-- FLEXBOX -->
  <text x="20" y="62" font-size="14" font-weight="700" fill="#0d6efd">display: flex</text>
  <rect x="20" y="72" width="220" height="90" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
  <rect x="28" y="80" width="60" height="74" fill="#e7f1ff" stroke="#0d6efd"/>
  <text x="58" y="123" font-size="11" text-anchor="middle" fill="#0a58ca">flex-grow:0</text>
  <rect x="92" y="80" width="140" height="74" fill="#d0e2ff" stroke="#0d6efd"/>
  <text x="162" y="123" font-size="11" text-anchor="middle" fill="#0a58ca">flex-grow:1</text>
  <text x="130" y="186" font-size="12" text-anchor="middle" fill="#495057">the ITEMS grow / shrink</text>

  <!-- GRID -->
  <text x="290" y="62" font-size="14" font-weight="700" fill="#0d6efd">display: grid</text>
  <rect x="290" y="72" width="210" height="90" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
  <rect x="290" y="72" width="70" height="90" fill="#e7f1ff" stroke="#0d6efd"/>
  <rect x="360" y="72" width="140" height="90" fill="#d0e2ff" stroke="#0d6efd"/>
  <text x="325" y="123" font-size="11" text-anchor="middle" fill="#0a58ca">auto</text>
  <text x="430" y="123" font-size="11" text-anchor="middle" fill="#0a58ca">1fr</text>
  <text x="395" y="186" font-size="12" text-anchor="middle" fill="#495057">the TRACKS are sized</text>

  <text x="20" y="230" font-size="14" fill="#212529">Their size comes from the track list,</text>
  <text x="20" y="252" font-size="14" fill="#212529">not from the items themselves.</text>
  <text x="20" y="284" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#495057">1fr · minmax() · auto · max-content ...</text>
</svg>
