<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="320" fill="#f8f9fa"/>
  <rect x="1" y="1" width="518" height="318" fill="none" stroke="#ced4da" stroke-width="2"/>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#212529">overlay vs. expanding section</text>

  <!-- overlay -->
  <text x="40" y="66" font-size="14" font-weight="600" fill="#0d6efd">overlay panel</text>
  <rect x="40" y="80" width="180" height="34" rx="5" fill="#0d6efd"/>
  <text x="56" y="102" font-size="13" fill="#ffffff">button</text>
  <rect x="40" y="130" width="180" height="150" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="54" y="148" width="150" height="10" rx="5" fill="#e9ecef"/>
  <rect x="54" y="168" width="120" height="10" rx="5" fill="#e9ecef"/>
  <rect x="54" y="188" width="140" height="10" rx="5" fill="#e9ecef"/>
  <rect x="54" y="208" width="100" height="10" rx="5" fill="#e9ecef"/>
  <rect x="54" y="228" width="130" height="10" rx="5" fill="#e9ecef"/>
  <rect x="54" y="248" width="90" height="10" rx="5" fill="#e9ecef"/>
  <rect x="54" y="114" width="150" height="80" rx="5" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <text x="66" y="140" font-size="12" fill="#212529">panel</text>
  <text x="66" y="158" font-size="11" fill="#0d6efd">covers content</text>
  <text x="40" y="300" font-size="12" fill="#6c757d">content does NOT move</text>

  <!-- expanding section -->
  <text x="290" y="66" font-size="14" font-weight="600" fill="#198754">expanding section</text>
  <rect x="290" y="80" width="180" height="34" rx="5" fill="#198754"/>
  <text x="306" y="102" font-size="13" fill="#ffffff">button</text>
  <rect x="290" y="118" width="180" height="80" rx="5" fill="#ffffff" stroke="#198754" stroke-width="2"/>
  <text x="304" y="144" font-size="12" fill="#212529">section</text>
  <text x="304" y="162" font-size="11" fill="#198754">pushes content down</text>
  <rect x="290" y="206" width="180" height="74" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="304" y="222" width="150" height="10" rx="5" fill="#e9ecef"/>
  <rect x="304" y="242" width="120" height="10" rx="5" fill="#e9ecef"/>
  <rect x="304" y="262" width="100" height="10" rx="5" fill="#e9ecef"/>
  <text x="290" y="300" font-size="12" fill="#6c757d">content moves DOWN</text>
</svg>
