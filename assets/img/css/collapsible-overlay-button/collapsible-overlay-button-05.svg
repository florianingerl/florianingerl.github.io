<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="320" fill="#f8f9fa"/>
  <rect x="1" y="1" width="518" height="318" fill="none" stroke="#ced4da" stroke-width="2"/>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#212529">top: 100%  and  left: 0</text>

  <!-- relative parent (dashed) -->
  <rect x="60" y="80" width="240" height="60" fill="none" stroke="#6c757d" stroke-dasharray="6 4"/>
  <text x="72" y="72" font-size="12" fill="#6c757d">.topic-filter  { position: relative; }</text>

  <rect x="72" y="92" width="216" height="36" rx="5" fill="#0d6efd"/>
  <text x="90" y="115" font-size="14" fill="#ffffff">Choose a topic...</text>

  <!-- overlay anchored at top:100%, left:0 -->
  <rect x="60" y="140" width="240" height="120" rx="6" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <text x="76" y="166" font-size="13" fill="#212529">Topic A</text>
  <text x="76" y="190" font-size="13" fill="#212529">Topic B</text>
  <text x="76" y="214" font-size="13" fill="#212529">Topic C</text>

  <!-- measurement lines -->
  <line x1="60" y1="80" x2="40" y2="80" stroke="#dc3545"/>
  <line x1="40" y1="80" x2="40" y2="140" stroke="#dc3545" stroke-dasharray="4 3"/>
  <line x1="40" y1="140" x2="60" y2="140" stroke="#dc3545"/>
  <text x="8" y="115" font-size="11" fill="#dc3545">top:100%</text>

  <line x1="60" y1="140" x2="60" y2="268" stroke="#198754"/>
  <text x="300" y="200" font-size="12" fill="#198754">left: 0  aligns with parent's</text>
  <text x="300" y="218" font-size="12" fill="#198754">left edge, directly below it</text>

  <text x="60" y="292" font-size="13" fill="#6c757d">top: 100% means "start at the bottom edge of the parent".</text>
</svg>
