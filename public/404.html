<!DOCTYPE html>
<html lang="de">

<head>
	<meta charset="utf-8">
	<title>Frag Florian!</title>
	<!--
		GitHub Pages liefert bei unbekannten Pfaden (z.B. /whiteboard beim
		direkten Aufruf oder Neuladen) diese 404-Seite aus. Weil die App den
		History-Modus von Vue Router benutzt, leiten wir den Pfad so um, dass
		index.html ihn wiederherstellen kann (siehe spa-github-pages).
	-->
	<script type="text/javascript">
		var pathSegmentsToKeep = 0;
		var l = window.location;
		l.replace(
			l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
			l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
			l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
			(l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
			l.hash
		);
	</script>
</head>

<body>
</body>

</html>
