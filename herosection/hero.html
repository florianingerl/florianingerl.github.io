<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Hero</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .snake-text {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  overflow: visible;
  pointer-events: none;
}

.snake-text text {
  fill: white;
  font-family: Arial, sans-serif;
  font-size: 30px;
  font-weight: 700;
  opacity: 0;
  filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.8));
  animation: snake-appears 1.5s ease-out 1s forwards;
}

@keyframes snake-appears {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  .snake-text text {
    animation: none;
    opacity: 1;
  }
}

    .hero {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem;
      overflow: hidden;
      color: white;
      text-align: center;

      /* Background image with a dark overlay for readable text */
      background:
        linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
        url("physicsschool.jpg") center / cover no-repeat;
    }

    .head-image {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 50%;
      width: min(35vw, 280px);
      height: auto;
      transform: translateX(-50%);
      animation: head-falls 1.2s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }

    .hero h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 8vw, 6rem);
      opacity: 0;
      animation: text-appears 0.7s ease-out 1s forwards;
    }

    .hero p {
      margin: 0;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      opacity: 0;
      animation: text-appears 0.7s ease-out 1.3s forwards;
    }

    @keyframes head-falls {
      from {
        transform: translate(-50%, -120%);
      }

      to {
        transform: translate(-50%, 25vh);
      }
    }

    @keyframes text-appears {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .head-image,
      .hero h1,
      .hero p {
        animation: none;
        opacity: 1;
      }

      .head-image {
        transform: translate(-50%, 25vh);
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <img
        class="head-image"
        src="justmyhead.png"
        alt="My head"
      >

      <div class="hero-content">
        <h1 id="hero-title">Frag Florian</h1>
        <p>Private tuition for university and school</p>
      </div>

      <svg
  class="snake-text"
  viewBox="0 0 1000 700"
  preserveAspectRatio="none"
  role="img"
  aria-label="Private tuition in maths, physics, computer science and engineering"
>
  <defs>
    <!-- A flowing path with two curls -->
    <path
  id="snake-path"
  d="
    M 40,70
    C 180,10 220,180 360,130
    S 500,80 600,220
    S 750,300 800,390
    S 900,500 960,640
  "
/>
  </defs>

  <text>
    <textPath href="#snake-path">
      Private tuition in maths, physics, computer science and engineering
    </textPath>
  </text>
</svg>

    </section>
  </main>
</body>
</html>
